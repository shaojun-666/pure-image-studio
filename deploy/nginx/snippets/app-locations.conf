# 代理规则。HTTP 与 HTTPS 两个 server 共用这一份，避免两处各写一遍后改漏。

# ★ 上游写成变量 + nginx.conf 里的 resolver：nginx 默认只在启动时解析一次 hostname，
#   而 `docker compose restart app` 会拿到新 IP —— 不这么做的话重启后必然 502，
#   直到有人手动 reload nginx。
#   代价是用不了 upstream keepalive（每个请求新建连接），单机规模下无所谓。
set $app "http://app:3000";

proxy_http_version 1.1;
# 用 $http_host 而不是 $host：$host 会丢掉端口，应用据此拼出的绝对
# URL（如 OAuth 回调、下载跳转）就会缺端口甚至退回内部监听地址
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_read_timeout    120s;

# 上传 ≤10MB（直传 OSS 时其实用不到这么大，留给兜底的multipart路径）
client_max_body_size 20m;

# ★ 这条必须排在通用 /api/ 之前。被下面那条吃掉的话，proxy_buffering 会把
#   SSE 攒到最后一并刷出 —— 进度条就变成「转半天然后瞬间完成」。
location ~ ^/api/generations/[^/]+/events$ {
  proxy_pass $app;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

location /api/ {
  proxy_pass $app;
}

location / {
  proxy_pass $app;
}
