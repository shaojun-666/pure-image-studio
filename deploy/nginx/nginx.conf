# 主配置。站点相关的 server/location 在 conf.d/app.conf（TLS 模式下被 tls/app.conf 顶替）。
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;
  server_tokens off;

  # Docker 内置 DNS。上游地址在 app.conf 里写成变量，让它每次按 TTL 重新解析 ——
  # 见那里的注释：容器重启会换 IP，nginx 默认只在启动时解析一次。
  resolver 127.0.0.11 valid=10s ipv6=off;

  # 应用侧 compress: false，压缩统一在这里做
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json
             application/xml image/svg+xml application/manifest+json;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  include /etc/nginx/conf.d/*.conf;
}
