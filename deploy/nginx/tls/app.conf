# TLS 站点。在 docker-compose.tls.yml 里顶替 conf.d/app.conf。
#
# 证书就放两个固定文件名：deploy/certs/fullchain.pem + privkey.pem。
# 阿里云的免费 DV 证书下载下来正是「域名.pem + 域名.key」，改个名丢进去即可（一年一换）。
# 刻意不挂 certbot：容器里做 DNS-01 要装阿里云插件 + 塞 RAM 密钥，
# 一年手动换一次证书的成本远低于维护那套东西。
server {
  listen 80 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_stapling on;
  ssl_stapling_verify on;

  add_header Strict-Transport-Security "max-age=31536000" always;
  # 备案下来后如果站点只在境内服务，可以再加 Content-Security-Policy，
  # 但那需要先把内联样式清干净，别急着开。

  include /etc/nginx/snippets/app-locations.conf;
}
