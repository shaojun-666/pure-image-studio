# 本地开发只起一个 Postgres，应用用 pnpm dev 跑在宿主机上。
# 用法：docker compose -f docker-compose.dev.yml up -d
name: aigc-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aigc
      POSTGRES_PASSWORD: aigc_dev_pw
      POSTGRES_DB: aigc
      TZ: Asia/Shanghai
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aigc -d aigc']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '3' }

volumes:
  pgdata_dev: {}
